server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;
    gzip_min_length 512;

    # HTML: always revalidate so page edits show up immediately
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Versioned assets (css/js are cache-busted via ?v= query strings in the HTML)
    location ~ \.(css|js)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Images can cache longer
    location ~ \.(jpg|jpeg|png|gif|ico|webp|avif|svg)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Deploy/config files land in the docroot via the blanket COPY in the
    # Dockerfile — never serve them.
    location ~ ^/(nginx\.conf|\.dockerignore)$ {
        deny all;
    }
}
